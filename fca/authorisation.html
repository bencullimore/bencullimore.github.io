<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>Step 2: Authorisation Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/govuk-frontend@4.7.0/govuk/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/govuk-frontend@4.7.0/govuk/all.min.js"></script>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body class="govuk-template__body">
    <script>window.GOVUKFrontend.initAll()</script>

    <div class="govuk-width-container">
      <a href="services.html" class="govuk-back-link">Back</a>

      <main class="govuk-main-wrapper" id="main-content" role="main">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">
            <form id="auth-form" action="volume.html" method="get">
              <h1 class="govuk-heading-l">Is your business already authorised by the FCA?</h1>
              <div class="govuk-form-group">
                <fieldset class="govuk-fieldset">
                  <div class="govuk-radios">
                    <div class="govuk-radios__item">
                      <input class="govuk-radios__input" id="authorised-yes" name="authorised" type="radio" value="yes">
                      <label class="govuk-label govuk-radios__label" for="authorised-yes">Yes</label>
                    </div>
                    <div class="govuk-radios__item">
                      <input class="govuk-radios__input" id="authorised-no" name="authorised" type="radio" value="no">
                      <label class="govuk-label govuk-radios__label" for="authorised-no">No</label>
                    </div>
                  </div>
                </fieldset>
              </div>
              <div id="hidden-services"></div>
              <button class="govuk-button" type="submit">Continue</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const services = params.getAll("services");
      const container = document.getElementById("hidden-services");

      services.forEach(service => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "services";
        input.value = service;
        container.appendChild(input);
      });
    </script>
  </body>
</html>
